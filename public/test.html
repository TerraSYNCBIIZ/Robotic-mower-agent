<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mower API Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
    }
    h1 {
      color: #2c3e50;
    }
    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px 0;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #2980b9;
    }
    input, select {
      display: block;
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .card {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 20px;
    }
    pre {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
    .error {
      color: #e74c3c;
      background: #fadbd8;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .success {
      color: #27ae60;
      background: #d4efdf;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Mower API Test</h1>
  
  <div class="card">
    <h2>Test Mower API</h2>
    
    <div>
      <label for="token">Auth Token:</label>
      <input type="text" id="token" placeholder="Paste your auth token here" />
    </div>
    
    <div>
      <label for="mowerId">Mower ID:</label>
      <input type="text" id="mowerId" placeholder="Enter mower ID" />
    </div>
    
    <div>
      <label for="command">Command:</label>
      <select id="command">
        <option value="start">Start</option>
        <option value="pause">Pause</option>
        <option value="park">Park</option>
        <option value="parkUntilNext">Park Until Next Schedule</option>
      </select>
    </div>
    
    <div>
      <label for="duration">Duration (minutes):</label>
      <input type="number" id="duration" value="60" />
    </div>
    
    <button onclick="testGetEndpoint()">Test GET Endpoint</button>
    <button onclick="testPostEndpoint()">Test POST Endpoint</button>
    
    <div id="result" style="margin-top: 20px;"></div>
  </div>
  
  <script>
    // Function to get auth token from input
    function getToken() {
      return document.getElementById('token').value.trim();
    }
    
    // Function to get mower ID from input
    function getMowerId() {
      return document.getElementById('mowerId').value.trim();
    }
    
    // Function to test GET endpoint
    async function testGetEndpoint() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Testing GET endpoint...';
      
      const token = getToken();
      const mowerId = getMowerId();
      
      if (!token) {
        resultDiv.innerHTML = '<div class="error">Please enter an auth token</div>';
        return;
      }
      
      if (!mowerId) {
        resultDiv.innerHTML = '<div class="error">Please enter a mower ID</div>';
        return;
      }
      
      try {
        const response = await fetch(`/api/mowers/${mowerId}/actions`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        const data = await response.json();
        
        resultDiv.innerHTML = `
          <div class="${response.ok ? 'success' : 'error'}">
            Status: ${response.status} ${response.statusText}
          </div>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    }
    
    // Function to test POST endpoint
    async function testPostEndpoint() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Testing POST endpoint...';
      
      const token = getToken();
      const mowerId = getMowerId();
      const command = document.getElementById('command').value;
      const duration = parseInt(document.getElementById('duration').value);
      
      if (!token) {
        resultDiv.innerHTML = '<div class="error">Please enter an auth token</div>';
        return;
      }
      
      if (!mowerId) {
        resultDiv.innerHTML = '<div class="error">Please enter a mower ID</div>';
        return;
      }
      
      try {
        const response = await fetch(`/api/mowers/${mowerId}/actions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            command,
            duration: isNaN(duration) ? undefined : duration
          })
        });
        
        const data = await response.json();
        
        resultDiv.innerHTML = `
          <div class="${response.ok ? 'success' : 'error'}">
            Status: ${response.status} ${response.statusText}
          </div>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
      }
    }
  </script>
</body>
</html>
